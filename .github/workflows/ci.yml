name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: App bundle
        run: |
          make app
          cd build && ditto -c -k --keepParent Macpeek.app Macpeek.zip
      - uses: actions/upload-artifact@v5
        with:
          name: Macpeek
          path: build/Macpeek.zip
